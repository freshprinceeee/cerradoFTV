<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fila Futvôlei</title>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}
h1{
    text-align:center;
}
input{
    padding:10px;
    width:70%;
}
button{
    padding:10px;
    cursor:pointer;
}
ul{
    list-style:none;
    padding:0;
}
li{
    background:white;
    margin:6px 0;
    padding:12px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:move;
}
.remove{
    background:#ff4d4d;
    color:white;
    border:none;
    border-radius:4px;
}
.card{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
}
</style>
</head>
<body>

<h1>🏐 Fila Futvôlei</h1>

<input id="nome" placeholder="Nome do jogador">
<button onclick="adicionar()">Adicionar</button>

<div class="card">
    <h2>Fila</h2>
    <ul id="fila"></ul>
</div>

<div class="card">
    <h2>Próximo Jogo</h2>
    <div id="jogo">Aguardando jogadores...</div>
</div>

<script>

const fila = [];

function renderizar(){

    const ul = document.getElementById("fila");
    ul.innerHTML = "";

    fila.forEach((nome,index)=>{
        const li = document.createElement("li");

        li.innerHTML = `
            <span>${index+1}. ${nome}</span>
            <button class="remove" onclick="remover(${index})">
                Sair
            </button>
        `;

        ul.appendChild(li);
    });

    atualizarJogo();
}

function adicionar(){

    const input = document.getElementById("nome");

    if(!input.value.trim()) return;

    fila.push(input.value.trim());

    input.value = "";
    renderizar();
}

function remover(index){
    fila.splice(index,1);
    renderizar();
}

function atualizarJogo(){

    const div = document.getElementById("jogo");

    if(fila.length < 4){
        div.innerHTML = "É necessário pelo menos 4 jogadores.";
        return;
    }

    div.innerHTML = `
        <strong>Dupla 1</strong><br>
        ${fila[0]} + ${fila[1]}
        <br><br>
        <strong>VS</strong>
        <br><br>
        <strong>Dupla 2</strong><br>
        ${fila[2]} + ${fila[3]}
    `;
}

const sortable = new Sortable(document.getElementById("fila"),{
    animation:150,
    onEnd:function(evt){

        const item = fila.splice(evt.oldIndex,1)[0];
        fila.splice(evt.newIndex,0,item);

        renderizar();
    }
});

renderizar();

</script>

</body>
</html>
