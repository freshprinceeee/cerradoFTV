<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cerrado FTV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>

:root{
--bg:#071018;
--card:#12202d;
--card2:#182b3a;
--green:#00d26a;
--orange:#ffb11b;
--red:#ff5c5c;
--text:#ffffff;
--muted:#9fb2c3;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:var(--bg);
color:var(--text);
padding:15px;
padding-bottom:50px;
}

.container{
max-width:800px;
margin:auto;
}

.logo{
text-align:center;
font-size:2rem;
font-weight:700;
margin-bottom:10px;
}

.subtitleTop{
text-align:center;
color:var(--muted);
margin-bottom:20px;
}

.card{
background:var(--card);
border-radius:18px;
padding:16px;
margin-bottom:15px;
box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.section-title{
font-size:18px;
font-weight:600;
margin-bottom:12px;
}

.counter{
text-align:center;
font-size:14px;
color:var(--muted);
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
margin-bottom:10px;
outline:none;
}

button{
border:none;
cursor:pointer;
border-radius:12px;
font-weight:600;
}

.btn{
width:100%;
padding:14px;
}

.btn-green{
background:var(--green);
color:white;
}

.btn-orange{
background:var(--orange);
color:black;
margin-top:10px;
}

.btn-red{
background:var(--red);
color:white;
width:auto;
padding:6px 12px;
}

.arena{
text-align:center;
line-height:2;
font-size:18px;
}

.team{
background:var(--card2);
padding:12px;
border-radius:12px;
margin:8px 0;
}

.player{
background:var(--card2);
padding:12px;
border-radius:12px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.rank{
background:var(--card2);
padding:12px;
border-radius:12px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
}

.badge{
background:var(--green);
display:inline-block;
padding:4px 10px;
border-radius:20px;
font-size:12px;
font-weight:600;
margin-bottom:8px;
}

.reset{
background:#2b3741;
color:white;
padding:14px;
width:100%;
margin-top:15px;
}

.next{
color:var(--green);
font-weight:600;
}

.empty{
text-align:center;
color:var(--muted);
padding:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
🏐 Cerrado FTV
</div>

<div class="subtitleTop">
Sistema de Rodízio de Futvôlei
</div>

<div class="counter" id="contador"></div>

<div class="card">

<div class="section-title">
Adicionar Jogador
</div>

<input
id="novoJogador"
placeholder="Digite o nome">

<button
class="btn btn-green"
onclick="adicionarJogador()">
Adicionar
</button>

</div>

<div class="card">

<div class="section-title">
🔥 Em Quadra
</div>

<div id="quadra"></div>

</div>

<div class="card">

<div class="section-title">
➡️ Próximos a Entrar
</div>

<div id="proximos"></div>

</div>

<div class="card">

<div class="section-title">
📋 Fila de Espera
</div>

<div id="fila"></div>

</div>

<div class="card">

<div class="section-title">
🏆 Resultado da Partida
</div>

<button
class="btn btn-orange"
onclick="registrarVitoria(1)">
Dupla 1 Venceu
</button>

<button
class="btn btn-orange"
onclick="registrarVitoria(2)">
Dupla 2 Venceu
</button>

</div>

<div class="card">

<div class="section-title">
🥇 Ranking
</div>

<div id="ranking"></div>

<button
class="reset"
onclick="zerarNoite()">
🔄 Reiniciar Noite
</button>

</div>

</div>

<script>

let jogadores =
JSON.parse(localStorage.getItem("ftv_jogadores")) || [];

let vitorias =
JSON.parse(localStorage.getItem("ftv_vitorias")) || {};

function salvar(){
localStorage.setItem("ftv_jogadores",JSON.stringify(jogadores));
localStorage.setItem("ftv_vitorias",JSON.stringify(vitorias));
}

function adicionarJogador(){

const input =
document.getElementById("novoJogador");

const nome =
input.value.trim();

if(!nome) return;

const id = Date.now();

jogadores.push({
id:id,
nome:nome
});

if(!vitorias[id]){
vitorias[id]={
nome:nome,
wins:0
};
}

input.value="";

salvar();
renderizar();

}

function removerJogador(id){

jogadores =
jogadores.filter(j=>j.id!==id);

salvar();
renderizar();

}

function registrarVitoria(time){

if(jogadores.length<4) return;

let dupla1=[jogadores[0],jogadores[1]];
let dupla2=[jogadores[2],jogadores[3]];

let vencedores =
time===1 ? dupla1 : dupla2;

let perdedores =
time===1 ? dupla2 : dupla1;

vencedores.forEach(j=>{
if(vitorias[j.id]){
vitorias[j.id].wins++;
}
});

jogadores = [
...vencedores,
...jogadores.slice(4),
...perdedores
];

salvar();
renderizar();

}

function zerarNoite(){

if(!confirm("Deseja apagar toda a fila e ranking?")){
return;
}

jogadores=[];
vitorias={};

salvar();
renderizar();

}

function renderizar(){

document.getElementById("contador")
.innerText =
`${jogadores.length} jogadores presentes`;

const quadra =
document.getElementById("quadra");

if(jogadores.length>=4){

quadra.innerHTML = `
<div class
