<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071913">
  <title>Cerrado FTV | Fila de Futvôlei</title>
  <style>
    :root {
      --bg: #06130f;
      --surface: #0d211a;
      --surface-2: #143127;
      --line: #24483b;
      --green: #29d17d;
      --green-dark: #0c5635;
      --yellow: #ffc857;
      --blue: #49a7ff;
      --red: #ff6868;
      --text: #f5fff9;
      --muted: #a6bdb2;
      --shadow: 0 14px 35px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(41,209,125,.14), transparent 28rem),
        linear-gradient(180deg, #071913 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px 14px calc(36px + env(safe-area-inset-bottom));
    }
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    .app { width: min(100%, 760px); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 18px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      object-fit: contain;
      background: #fff;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .brand-fallback {
      width: 58px;
      height: 58px;
      display: none;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--green), #15995a);
      color: #03130c;
      font-weight: 900;
      font-size: 14px;
      box-shadow: var(--shadow);
    }
    .brand h1 { margin: 0; font-size: clamp(1.25rem, 5vw, 1.7rem); line-height: 1.05; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: .82rem; }
    .presence {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(13,33,26,.82);
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
    }
    .presence strong { color: var(--green); }
    .card {
      margin: 0 0 14px;
      padding: 17px;
      border: 1px solid rgba(79,130,107,.26);
      border-radius: 22px;
      background: rgba(13,33,26,.93);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }
    .card h2 { margin: 0; font-size: 1rem; }
    .hint { color: var(--muted); font-size: .76rem; }
    .add-form { display: grid; grid-template-columns: 1fr auto; gap: 9px; }
    .add-form input {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #081a14;
      color: var(--text);
      padding: 14px;
    }
    .add-form input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(41,209,125,.14); }
    .add-form button, .primary {
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: #042014;
      padding: 0 17px;
      font-weight: 900;
      cursor: pointer;
    }
    .add-form button:active, .primary:active { transform: translateY(1px); }
    .message { min-height: 20px; margin: 8px 2px 0; color: var(--yellow); font-size: .8rem; }
    .court { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 9px; }
    .team {
      min-width: 0;
      padding: 14px 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--surface-2), #0e281f);
      text-align: center;
    }
    .team-label { margin-bottom: 9px; color: var(--muted); font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
    .team-name { overflow-wrap: anywhere; font-weight: 800; line-height: 1.4; }
    .versus { display: grid; place-items: center; color: var(--yellow); font-size: .75rem; font-weight: 900; }
    .court-empty, .empty { padding: 18px 8px; color: var(--muted); text-align: center; }
    .result-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
    .win-btn {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-2);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .win-btn:first-child { border-color: rgba(41,209,125,.5); }
    .win-btn:last-child { border-color: rgba(73,167,255,.5); }
    .win-btn:disabled { cursor: not-allowed; opacity: .4; }
    .next-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
    .next-team {
      padding: 12px;
      border-radius: 16px;
      background: rgba(255,200,87,.1);
      border: 1px solid rgba(255,200,87,.32);
      text-align: center;
    }
    .next-team-label {
      margin-bottom: 7px;
      color: var(--yellow);
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .next-team-names { color: var(--text); font-weight: 800; line-height: 1.45; }
    .queue { display: grid; gap: 8px; }
    .player {
      display: grid;
      grid-template-columns: 34px minmax(0,1fr) auto;
      align-items: center;
      gap: 9px;
      min-height: 54px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface-2);
    }
    .player.dragging { opacity: .45; }
    .player.on-court {
      border-color: rgba(41,209,125,.65);
      background: linear-gradient(90deg, rgba(41,209,125,.18), var(--surface-2));
      box-shadow: inset 4px 0 0 var(--green);
    }
    .player.next-up {
      border-color: rgba(255,200,87,.62);
      background: linear-gradient(90deg, rgba(255,200,87,.15), var(--surface-2));
      box-shadow: inset 4px 0 0 var(--yellow);
    }
    .player.waiting { border-color: var(--line); background: var(--surface-2); }
    .player.on-court .position { color: #06130f; background: var(--green); }
    .player.next-up .position { color: #2a1b00; background: var(--yellow); }
    .player.on-court .player-status { color: #7ff0b5; }
    .player.next-up .player-status { color: #ffe09a; }
    .position { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: #0a2018; color: var(--green); font-size: .8rem; font-weight: 900; cursor: grab; }
    .player-name { min-width: 0; overflow-wrap: anywhere; font-weight: 750; }
    .player-status { display: block; margin-top: 2px; color: var(--muted); font-size: .7rem; font-weight: 500; }
    .player-actions { display: flex; gap: 5px; }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0b2119;
      color: var(--text);
      cursor: pointer;
    }
    .icon-btn.remove { color: #ff9b9b; }
    .ranking { display: grid; gap: 8px; }
    .rank-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 9px; align-items: center; padding: 11px; border-radius: 14px; background: var(--surface-2); }
    .medal { text-align: center; }
    .wins { color: var(--green); font-weight: 900; }
    .footer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .secondary, .danger {
      min-height: 45px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .danger { color: #ff9b9b; border-color: rgba(255,104,104,.35); }
    dialog { width: min(92vw, 410px); border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--text); padding: 20px; }
    dialog::backdrop { background: rgba(0,0,0,.72); }
    dialog h3 { margin-top: 0; }
    dialog p { color: var(--muted); }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
    .dialog-actions button { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); font-weight: 800; cursor: pointer; }
    .cancel { background: var(--surface-2); color: var(--text); }
    .confirm { background: var(--red); color: #fff; }
    @media (max-width: 430px) {
      body { padding-inline: 10px; }
      .card { padding: 14px; border-radius: 19px; }
      .brand-logo, .brand-fallback { width: 50px; height: 50px; border-radius: 15px; }
      .add-form { grid-template-columns: 1fr; }
      .add-form button { min-height: 47px; }
      .court { grid-template-columns: 1fr; }
      .versus { min-height: 24px; }
      .player { grid-template-columns: 30px minmax(0,1fr) auto; padding-inline: 7px; }
      .icon-btn { width: 31px; height: 31px; }
      .next-grid { grid-template-columns: 1fr 1fr; }
      .next-team { padding: 10px 7px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img id="brandLogo" class="brand-logo" src="logo-cerrado-ftv.png" alt="Logo Cerrado FTV">
        <div id="brandFallback" class="brand-fallback" aria-hidden="true">CFTV</div>
        <div><h1>Cerrado FTV</h1><p>Fila e rodízio de futvôlei</p></div>
      </div>
      <div class="presence"><strong id="count">0</strong> presentes</div>
    </header>

    <section class="card" aria-labelledby="addTitle">
      <div class="card-head"><h2 id="addTitle">Adicionar jogador</h2><span class="hint">ordem de chegada</span></div>
      <form id="addForm" class="add-form" novalidate>
        <input id="nameInput" type="text" maxlength="32" autocomplete="off" placeholder="Nome do jogador" aria-label="Nome do jogador">
        <button type="submit">Adicionar</button>
      </form>
      <div id="message" class="message" role="status" aria-live="polite"></div>
    </section>

    <section class="card" aria-labelledby="courtTitle">
      <div class="card-head"><h2 id="courtTitle">🔥 Em quadra</h2><span class="hint">2 contra 2</span></div>
      <div id="court"></div>
      <div class="result-actions">
        <button id="team1Win" type="button" class="win-btn">🏆 Dupla 1 venceu</button>
        <button id="team2Win" type="button" class="win-btn">🏆 Dupla 2 venceu</button>
      </div>
    </section>

    <section class="card" aria-labelledby="nextTitle">
      <div class="card-head"><h2 id="nextTitle">➡️ Próximos a entrar</h2><span class="hint">primeiros da espera</span></div>
      <div id="nextPlayers"></div>
    </section>

    <section class="card" aria-labelledby="queueTitle">
      <div class="card-head"><h2 id="queueTitle">📋 Ordem dos jogadores</h2><span class="hint">arraste ou use ↑ ↓</span></div>
      <div id="queue" class="queue"></div>
    </section>

    <section class="card" aria-labelledby="rankTitle">
      <div class="card-head"><h2 id="rankTitle">🥇 Ranking da noite</h2><span class="hint">vitórias individuais</span></div>
      <div id="ranking" class="ranking"></div>
    </section>

    <section class="card footer-actions">
      <button id="clearWins" type="button" class="secondary">Zerar vitórias</button>
      <button id="resetNight" type="button" class="danger">Reiniciar noite</button>
    </section>
  </main>

  <dialog id="confirmDialog">
    <h3 id="dialogTitle">Confirmar</h3>
    <p id="dialogText"></p>
    <div class="dialog-actions">
      <button id="dialogCancel" type="button" class="cancel">Cancelar</button>
      <button id="dialogConfirm" type="button" class="confirm">Confirmar</button>
    </div>
  </dialog>

  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'cerradoFTV_v3';
      const $ = (selector) => document.querySelector(selector);
      const initialState = { players: [], wins: {} };
      let state = loadState();
      let draggedId = null;
      let pendingAction = null;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!saved || !Array.isArray(saved.players) || typeof saved.wins !== 'object') return structuredClone(initialState);
          return saved;
        } catch (_) { return structuredClone(initialState); }
      }
      function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      function createId() { return `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
      function normalized(value) { return value.trim().replace(/\s+/g, ' '); }
      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      }
      function setMessage(text = '') { $('#message').textContent = text; }

      function addPlayer(event) {
        event.preventDefault();
        const input = $('#nameInput');
        const name = normalized(input.value);
        if (!name) { setMessage('Digite o nome do jogador.'); input.focus(); return; }
        if (state.players.some(p => p.name.toLocaleLowerCase('pt-BR') === name.toLocaleLowerCase('pt-BR'))) {
          setMessage('Esse jogador já está na lista.'); input.select(); return;
        }
        const player = { id: createId(), name };
        state.players.push(player);
        state.wins[player.id] = state.wins[player.id] || 0;
        input.value = '';
        setMessage(`${name} entrou no fim da fila.`);
        persistAndRender();
        input.focus();
      }

      function removePlayer(id) {
        const player = state.players.find(p => p.id === id);
        if (!player) return;
        state.players = state.players.filter(p => p.id !== id);
        setMessage(`${player.name} foi retirado da noite.`);
        persistAndRender();
      }

      function movePlayer(id, direction) {
        const index = state.players.findIndex(p => p.id === id);
        const target = index + direction;
        if (index < 0 || target < 0 || target >= state.players.length) return;
        [state.players[index], state.players[target]] = [state.players[target], state.players[index]];
        persistAndRender();
      }

      function registerWin(teamNumber) {
        if (state.players.length < 4) { setMessage('São necessários 4 jogadores para registrar o resultado.'); return; }
        const team1 = state.players.slice(0, 2);
        const team2 = state.players.slice(2, 4);
        const winners = teamNumber === 1 ? team1 : team2;
        const losers = teamNumber === 1 ? team2 : team1;
        winners.forEach(p => state.wins[p.id] = (state.wins[p.id] || 0) + 1);
        state.players = [...winners, ...state.players.slice(4), ...losers];
        setMessage(`${winners.map(p => p.name).join(' e ')} venceram e permanecem na quadra.`);
        persistAndRender();
      }

      function statusAt(index) {
        if (index < 2) return 'Dupla 1, em quadra';
        if (index < 4) return 'Dupla 2, em quadra';
        if (index < 6) return 'Próxima dupla 1';
        if (index < 8) return 'Próxima dupla 2';
        return `${index - 7}º após as próximas duplas`;
      }

      function queueClassAt(index) {
        if (index < 4) return 'on-court';
        if (index < 8) return 'next-up';
        return 'waiting';
      }

      function renderCourt() {
        const court = $('#court');
        const ready = state.players.length >= 4;
        $('#team1Win').disabled = !ready;
        $('#team2Win').disabled = !ready;
        if (!ready) {
          court.innerHTML = `<div class="court-empty">Faltam ${4 - state.players.length} jogador(es) para formar a primeira partida.</div>`;
          return;
        }
        court.innerHTML = `<div class="court">
          <div class="team"><div class="team-label">Dupla 1</div><div class="team-name">${escapeHtml(state.players[0].name)}<br>${escapeHtml(state.players[1].name)}</div></div>
          <div class="versus">VS</div>
          <div class="team"><div class="team-label">Dupla 2</div><div class="team-name">${escapeHtml(state.players[2].name)}<br>${escapeHtml(state.players[3].name)}</div></div>
        </div>`;
      }

      function renderNext() {
        const nextFour = state.players.slice(4, 8);
        const teams = [nextFour.slice(0, 2), nextFour.slice(2, 4)].filter(team => team.length);

        $('#nextPlayers').innerHTML = teams.length
          ? `<div class="next-grid">${teams.map((team, index) => `
              <div class="next-team">
                <div class="next-team-label">Próxima dupla ${index + 1}</div>
                <div class="next-team-names">${team.map(player => escapeHtml(player.name)).join('<br>')}</div>
              </div>
            `).join('')}</div>`
          : '<div class="empty">Ainda não há jogadores aguardando.</div>';
      }

      function renderQueue() {
        const queue = $('#queue');
        if (!state.players.length) { queue.innerHTML = '<div class="empty">A lista está vazia. Adicione o primeiro jogador.</div>'; return; }
        queue.innerHTML = state.players.map((p, i) => `<div class="player ${queueClassAt(i)}" draggable="true" data-id="${p.id}">
          <div class="position" title="Arrastar">${i + 1}</div>
          <div class="player-name">${escapeHtml(p.name)}<span class="player-status">${statusAt(i)}</span></div>
          <div class="player-actions">
            <button type="button" class="icon-btn" data-action="up" data-id="${p.id}" aria-label="Subir ${escapeHtml(p.name)}" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button type="button" class="icon-btn" data-action="down" data-id="${p.id}" aria-label="Descer ${escapeHtml(p.name)}" ${i === state.players.length - 1 ? 'disabled' : ''}>↓</button>
            <button type="button" class="icon-btn remove" data-action="remove" data-id="${p.id}" aria-label="Remover ${escapeHtml(p.name)}">×</button>
          </div>
        </div>`).join('');
      }

      function renderRanking() {
        const activeIds = new Set(state.players.map(p => p.id));
        const ranked = state.players.map(p => ({...p, wins: state.wins[p.id] || 0})).sort((a,b) => b.wins - a.wins || a.name.localeCompare(b.name, 'pt-BR'));
        Object.keys(state.wins).forEach(id => { if (!activeIds.has(id)) delete state.wins[id]; });
        const medals = ['🥇','🥈','🥉'];
        $('#ranking').innerHTML = ranked.length ? ranked.map((p,i) => `<div class="rank-row"><div class="medal">${medals[i] || i + 1}</div><div>${escapeHtml(p.name)}</div><div class="wins">${p.wins} ${p.wins === 1 ? 'vitória' : 'vitórias'}</div></div>`).join('') : '<div class="empty">O ranking aparecerá aqui.</div>';
      }

      function render() {
        $('#count').textContent = state.players.length;
        renderCourt(); renderNext(); renderQueue(); renderRanking();
      }
      function persistAndRender() { saveState(); render(); }

      function openConfirm(title, text, action) {
        $('#dialogTitle').textContent = title;
        $('#dialogText').textContent = text;
        pendingAction = action;
        const dialog = $('#confirmDialog');
        if (typeof dialog.showModal === 'function') dialog.showModal(); else if (confirm(text)) action();
      }

      $('#addForm').addEventListener('submit', addPlayer);
      $('#team1Win').addEventListener('click', () => registerWin(1));
      $('#team2Win').addEventListener('click', () => registerWin(2));
      $('#queue').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const { action, id } = button.dataset;
        if (action === 'up') movePlayer(id, -1);
        if (action === 'down') movePlayer(id, 1);
        if (action === 'remove') removePlayer(id);
      });
      $('#queue').addEventListener('dragstart', (event) => {
        const row = event.target.closest('.player');
        if (!row) return;
        draggedId = row.dataset.id;
        row.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
      });
      $('#queue').addEventListener('dragend', (event) => { event.target.closest('.player')?.classList.remove('dragging'); draggedId = null; });
      $('#queue').addEventListener('dragover', (event) => event.preventDefault());
      $('#queue').addEventListener('drop', (event) => {
        event.preventDefault();
        const target = event.target.closest('.player');
        if (!target || !draggedId || target.dataset.id === draggedId) return;
        const from = state.players.findIndex(p => p.id === draggedId);
        const to = state.players.findIndex(p => p.id === target.dataset.id);
        const [moved] = state.players.splice(from, 1);
        state.players.splice(to, 0, moved);
        persistAndRender();
      });
      $('#clearWins').addEventListener('click', () => openConfirm('Zerar vitórias?', 'A ordem dos jogadores será mantida, mas todas as vitórias voltarão para zero.', () => {
        Object.keys(state.wins).forEach(id => state.wins[id] = 0);
        persistAndRender();
      }));
      $('#resetNight').addEventListener('click', () => openConfirm('Reiniciar a noite?', 'Todos os jogadores, a fila e o ranking serão apagados.', () => {
        state = structuredClone(initialState); setMessage('A noite foi reiniciada.'); persistAndRender();
      }));
      $('#dialogCancel').addEventListener('click', () => $('#confirmDialog').close());
      $('#dialogConfirm').addEventListener('click', () => { $('#confirmDialog').close(); if (pendingAction) pendingAction(); pendingAction = null; });
      $('#brandLogo').addEventListener('error', () => { $('#brandLogo').style.display = 'none'; $('#brandFallback').style.display = 'grid'; });

      render();
    })();
  </script>
</body>
</html>
